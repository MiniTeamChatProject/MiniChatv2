# MiniChat API Gateway Nginx 配置示例
#
# 功能：
# 1. JWT Token 验证
# 2. 用户信息提取并转发到后端服务
# 3. 路由分发到不同的微服务
#
# 使用说明：
# 1. 安装 nginx-plus 或 nginx + lua 模块
# 2. 复制此配置到 /etc/nginx/conf.d/minichat.conf
# 3. 修改 jwt_secret 为你的 JWT 密钥
# 4. 重启 nginx: nginx -s reload

upstream user_service {
    server user-service:8000;
    keepalive 32;
}

upstream room_service {
    server room-service:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name api.minichat.local;

    # CORS 配置
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

    # OPTIONS 预检请求
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ========================================
    # 用户服务路由 (需要 JWT 验证)
    # ========================================
    location /api/user/ {
        # JWT 验证
        auth_request /auth;

        # 转发用户信息到后端
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $username $upstream_http_x_username;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-Username $username;

        # 转发原始 Authorization header
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://user_service/;
    }

    # ========================================
    # 房间服务路由 (需要 JWT 验证)
    # ========================================
    location /api/rooms/ {
        # JWT 验证
        auth_request /auth;

        # 转发用户信息到后端
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $username $upstream_http_x_username;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-Username $username;

        proxy_pass http://room_service/v1/rooms/;
    }

    # ========================================
    # 公开路由 (无需 JWT 验证)
    # ========================================
    location /api/public/rooms {
        proxy_pass http://room_service/v1/rooms;
    }

    # ========================================
    # JWT 验证端点 (内部使用)
    # ========================================
    location = /auth {
        internal;

        # 调用用户服务验证 JWT
        proxy_pass http://user_service/user/profile;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;

        # 从用户服务响应中提取用户信息
        header_filter_by_lua_block {
            -- 从响应中解析用户 ID 并设置到 header
            -- 这里需要根据实际的 JWT 中间件实现调整
        }
    }

    # ========================================
    # WebSocket 路由
    # ========================================
    location /ws/room/ {
        proxy_pass http://room_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-User-ID $http_x_user_id;
        proxy_set_header X-Username $http_x_username;

        # WebSocket 超时配置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

