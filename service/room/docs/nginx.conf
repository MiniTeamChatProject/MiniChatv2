# MiniChat API Gateway - Nginx 配置
#
# 这是一个简化的 API Gateway 配置，用于演示目的
# 生产环境建议使用 Kong, Traefik 或 APISIX

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_user_id"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # ========================================
    # Upstream 服务配置
    # ========================================
    upstream user_service {
        server user-service:8000;
        keepalive 32;
    }

    upstream room_service {
        server room-service:8000;
        keepalive 32;
    }

    # ========================================
    # JWT 验证服务 (内部)
    # ========================================
    upstream jwt_verify {
        server user-service:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # ========================================
        # CORS 预检
        # ========================================
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-User-ID, X-Username' always;
            add_header 'Access-Control-Max-Age' 3600;
            return 204;
        }

        # ========================================
        # 公开端点 (无需认证)
        # ========================================
        location /api/public/rooms {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://room_service/v1/rooms;
        }

        # ========================================
        # 用户注册/登录 (白名单)
        # ========================================
        location ~ ^/api/(register|login) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://user_service;
        }

        # ========================================
        # 用户服务 API (需要 JWT)
        # ========================================
        location /api/user/ {
            # 调用 JWT 验证
            auth_request /jwt/verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;

            # 转发用户信息到后端
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Username $username;
            proxy_set_header Authorization $http_authorization;

            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://user_service/;
        }

        # ========================================
        # 房间服务 API (需要 JWT)
        # ========================================
        location /api/rooms/ {
            # 调用 JWT 验证
            auth_request /jwt/verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;

            # 转发用户信息到后端
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Username $username;
            proxy_set_header Authorization $http_authorization;

            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://room_service/v1/rooms/;
        }

        # ========================================
        # WebSocket 连接
        # ========================================
        location /ws/ {
            proxy_pass http://room_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-User-ID $http_x_user_id;
            proxy_set_header X-Username $http_x_username;

            proxy_connect_timeout 1h;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }

        # ========================================
        # JWT 验证端点 (内部使用)
        # ========================================
        location = /jwt/verify {
            internal;

            # 这里简化处理：直接转发 Authorization header
            # 实际应该有专门的验证端点
            proxy_pass http://user_service/user/profile;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # 如果验证成功，用户服务返回用户信息
            # 我们需要从中提取 X-User-ID 和 X-Username
            # 这需要用户服务的中间件支持
        }

        # ========================================
        # 健康检查
        # ========================================
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
