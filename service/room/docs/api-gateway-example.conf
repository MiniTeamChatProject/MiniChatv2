# API 网关配置示例
# 用于将用户系统与房间服务对接

# 方案一：使用 Nginx + Lua JWT 验证

nginx_conf = `
# 定义 JWT 密钥
lua_shared_dict jwt_secret 10m;

# JWT 验证函数
init_by_lua_block {
    local jwt = require "resty.jwt"
    -- 你的 JWT 密钥
    jwt_secret = "your-secret-key-here"
}

server {
    listen 8080;
    server_name api.example.com;

    # 公开接口（不需要认证）
    location /v1/rooms {
        proxy_pass http://room-service:8000;
    }

    # 需要认证的接口
    location /v1/ {
        # JWT 验证
        access_by_lua_block {
            local jwt = require "resty.jwt"

            -- 获取 Authorization header
            local auth_header = ngx.var.http_authorization
            if not auth_header then
                ngx.status = 401
                ngx.say("Missing authorization header")
                ngx.exit(401)
            end

            -- 提取 Bearer token
            local token = string.match(auth_header, "Bearer%s+(.+)")
            if not token then
                ngx.status = 401
                ngx.say("Invalid authorization format")
                ngx.exit(401)
            end

            -- 验证 JWT
            local jwt_obj = jwt:verify(jwt_secret, token)
            if not jwt_obj.valid then
                ngx.status = 401
                ngx.say("Invalid token: " .. jwt_obj.reason)
                ngx.exit(401)
            end

            -- 提取用户信息并设置到请求头
            ngx.req.set_header("X-User-ID", jwt_obj.payload.sub)
            ngx.req.set_header("X-Username", jwt_obj.payload.username or "")
            ngx.req.set_header("X-User-Role", jwt_obj.payload.role or "")
        }

        # 转发到房间服务
        proxy_pass http://room-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 需要特殊处理
    location /ws/ {
        access_by_lua_block {
            -- 从 URL 参数获取 token
            local token = ngx.var.arg_token
            if not token then
                ngx.status = 401
                ngx.exit(401)
            end

            -- 验证 JWT
            local jwt = require "resty.jwt"
            local jwt_obj = jwt:verify(jwt_secret, token)
            if not jwt_obj.valid then
                ngx.status = 401
                ngx.exit(401)
            end

            -- 设置用户信息到请求头
            ngx.req.set_header("X-User-ID", jwt_obj.payload.sub)
        }

        # WebSocket 代理
        proxy_pass http://room-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-User-ID $http_x_user_id;
    }
}
`

# 方案二：使用 Kong API Gateway

kong_config = `
# 1. 添加 JWT 插件
curl -X POST http://kong:8001/services/room-service/plugins \
  --data name=jwt

# 2. 配置 JWT 凭证
curl -X POST http://kong:8001/consumers/alice/jwt \
  --data algorithm=HS256 \
  --data key="alice-key" \
  --data secret="your-secret-key"

# 3. 客户端请求时添加 JWT 插件解析后的头
# Kong 会自动将 JWT payload 添加到请求头
# 也可以使用插件转换：
curl -X POST http://kong:8001/services/room-service/plugins \
  --data name=request-transformer \
  --data config.add.headers=X-User-ID:authenticated_userid
`

# 方案三：使用 Traefik

traefik_config = `
# docker-compose.yml
version: '3'
services:
  traefik:
    image: traefik:v2.10
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"

  room-service:
    image: room-service:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.room.rule=PathPrefix(/v1,/ws)"
      - "traefik.http.routers.room.middlerooms=jwt-auth"
      - "traefik.http.middlewares.jwt-auth.plugin.jwt=${JWT_SECRET}"

# traefik.yml
# api:
#   dashboard: true
#   insecure: true
#
# entryPoints:
#   web:
#     address: ":80"
`

# 前端请求示例

frontend_example = `
# 1. 用户登录获取 Token
const login = async () => {
  const response = await fetch('http://auth-service/login', {
    method: 'POST',
    body: JSON.stringify({
      username: 'alice',
      password: 'password123'
    })
  });

  const { token } = await response.json();
  localStorage.setItem('token', token);
};

// 2. 请求房间服务时携带 Token
const createRoom = async () => {
  const token = localStorage.getItem('token');

  const response = await fetch('http://api.example.com/v1/rooms', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': \`Bearer \${token}\`
    },
    body: JSON.stringify({
      name: '我的聊天室'
    })
  });

  return await response.json();
};

// 3. WebSocket 连接
const connectWebSocket = () => {
  const token = localStorage.getItem('token');

  // 方式1: 通过 URL 参数传递 token
  const ws = new WebSocket(\`ws://api.example.com/ws/room/1?token=\${token}\`);

  // 方式2: 通过子协议传递
  const ws = new WebSocket('ws://api.example.com/ws/room/1', ['token', token]);

  ws.onmessage = (event) => {
    const message = JSON.parse(event.data);
    console.log('收到消息:', message);
  };
};
`
