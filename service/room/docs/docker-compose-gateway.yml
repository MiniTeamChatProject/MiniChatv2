# MiniChat with API Gateway (Docker Compose)
#
# 这是一个完整的 Docker Compose 配置，包含 API Gateway
# 使用 Nginx 作为反向代理和 API Gateway
#
# 启动: docker-compose -f docker-compose-gateway.yml up -d

version: "3.9"

services:
  # ========================================
  # API Gateway (Nginx)
  # ========================================
  api-gateway:
    image: nginx:alpine
    container_name: minichat_gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - room-service
    networks:
      - minichat-network
    restart: unless-stopped

  # ========================================
  # 用户微服务
  # ========================================
  user-service:
    build:
      context: ./service/user
      dockerfile: Dockerfile
    container_name: user_service
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      - user-db
    environment:
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=07210721
      - DB_NAME=benutzer_db
    networks:
      - minichat-network
    restart: unless-stopped

  # ========================================
  # 房间微服务
  # ========================================
  room-service:
    build:
      context: ./service/room
      dockerfile: Dockerfile
    container_name: room_service
    ports:
      - "8001:8000"
      - "9001:9000"
    depends_on:
      - room-db
      - user-service
    environment:
      - DB_HOST=room-db
      - DB_PORT=5432
      - DB_USER=minichat
      - DB_PASSWORD=minichat123
      - DB_NAME=room_service
      - USER_SERVICE_ADDR=user-service:9000
    networks:
      - minichat-network
    restart: unless-stopped

  # ========================================
  # 用户数据库
  # ========================================
  user-db:
    image: postgres:16-alpine
    container_name: user_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 07210721
      POSTGRES_DB: benutzer_db
    ports:
      - "15432:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    networks:
      - minichat-network
    restart: unless-stopped

  # ========================================
  # 房间数据库
  # ========================================
  room-db:
    image: postgres:16-alpine
    container_name: room_db
    environment:
      POSTGRES_USER: minichat
      POSTGRES_PASSWORD: minichat123
      POSTGRES_DB: room_service
    ports:
      - "5432:5432"
    volumes:
      - room-postgres-data:/var/lib/postgresql/data
    networks:
      - minichat-network
    restart: unless-stopped

volumes:
  user-postgres-data:
  room-postgres-data:

networks:
  minichat-network:
    driver: bridge
