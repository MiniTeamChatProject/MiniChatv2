server:
  http:
    addr: 0.0.0.0:8000
    timeout: 10s
    metadata: true  # Enable Swagger UI
  grpc:
    addr: 0.0.0.0:9000
    timeout: 10s

data:
  database:
    driver: postgres
    source: postgres://minichat:minichat123@room-db:5432/room_service?sslmode=disable
    max_open_conns: 100
    max_idle_conns: 10
    conn_max_lifetime: 300s
    enable_auto_migrate: true  # Enable auto migration for development

# User Service gRPC Client (for service-to-service communication)
userClient:
  addr: user-service:9000  # Docker 环境使用服务名，本地开发可用 localhost:9000
  timeout: 10s

# Redis (optional, for future use)
