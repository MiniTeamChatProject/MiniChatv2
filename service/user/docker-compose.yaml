version: "3.9"

services:
  # --- 用户微服务 ---
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_dev
    ports:
      - "8000:8000"   # HTTP
      - "9000:9000"   # gRPC
    depends_on:
      - db
    environment:
      # 数据库连接（示例，按你 conf 里字段名来）
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=07210721
      - DB_NAME=benutzer_db
    restart: unless-stopped

  # --- PostgreSQL ---
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: user_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 07210721
      POSTGRES_DB: benutzer_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

